[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ComfyUI-Dazzle-VAE-DeGrid"
dynamic = ["version"]
description = "Removes the 2px VAE grid (hatching) from Qwen/Wan/Krea ComfyUI decodes via coherent global estimation -- diagnostic, image filter, and VAE wrapper nodes"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "djdarcy", email = "djdarcy@users.noreply.github.com"},
]
keywords = ["comfyui", "comfyui-nodes", "qwen", "wan", "vae", "artifact-removal", "image-processing", "dazzlenodes"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/DazzleNodes/ComfyUI-Dazzle-VAE-DeGrid"
Repository = "https://github.com/DazzleNodes/ComfyUI-Dazzle-VAE-DeGrid"
Issues = "https://github.com/DazzleNodes/ComfyUI-Dazzle-VAE-DeGrid/issues"

# ComfyUI custom node -- no CLI entry point

# ComfyUI Registry Configuration
# See: https://docs.comfy.org/registry/publishing
[tool.comfy]
PublisherId = "djdarcy"
DisplayName = "Dazzle VAE DeGrid"
Icon = ""

[tool.setuptools.dynamic]
version = {attr = "ComfyUI_Dazzle_VAE_DeGrid._version.PIP_VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ComfyUI_Dazzle_VAE_DeGrid", "ComfyUI_Dazzle_VAE_DeGrid.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

[tool.repokit-common]
version-source = "ComfyUI_Dazzle_VAE_DeGrid/_version.py"
changelog = "CHANGELOG.md"
repo-url = "https://github.com/DazzleNodes/ComfyUI-Dazzle-VAE-DeGrid"
tag-prefix = "v"
private-patterns = ["private/", "local/", ".env"]
